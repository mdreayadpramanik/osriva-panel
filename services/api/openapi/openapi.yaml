openapi: 3.1.0
info:
  title: OSRIVA Panel Core API
  version: "1.0.0-phase1"
  summary: One Platform. Every Server. Total Control.
  description: |
    Versioned REST API of OSRIVA Panel. Phase 1 covers identity, sessions, MFA,
    RBAC, audit logging and panel settings. Phase 2a adds managed servers and agent enrolment.

    **Authentication.** `POST /auth/login` sets an `HttpOnly` session cookie
    (`osriva_session`). Every unsafe request (POST/PUT/PATCH/DELETE) made with
    the cookie must send the `X-CSRF-Token` header returned by `/auth/me` or
    `/auth/login`. Request bodies must be `application/json`.

    **Re-authentication.** Dangerous operations return `403 reauth_required`
    unless the session confirmed the password within the re-auth window
    (default 10 minutes) via `POST /auth/reauth`.

    **Errors.** Every error has the shape `{"error":{"code","message","field?"},"request_id"}`.
    Stable codes: `validation_failed`, `policy_violation`, `invalid_credentials`,
    `mfa_required`, `invalid_mfa_code`, `rate_limited`, `unauthenticated`,
    `forbidden`, `reauth_required`, `csrf_failed`, `not_found`, `conflict`,
    `invalid_json`, `unsupported_media_type`, `body_too_large`, `internal_error`.
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
servers:
  - url: /api/v1
tags:
  - name: system
  - name: auth
  - name: users
  - name: audit
  - name: settings
  - name: servers
  - name: agent

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: osriva_session
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
  parameters:
    id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    AppInput:
      type: object
      required: [name, git_url, git_ref, build_mode, container_port, host_port]
      properties:
        name: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,39}$", description: "Immutable after creation" }
        git_url: { type: string, description: "https:// or http:// URL without credentials (public repositories only)" }
        git_ref: { type: string, description: "Branch or tag" }
        build_mode: { type: string, enum: [dockerfile, static, node] }
        build_context: { type: string, description: "Sub-directory of the repository" }
        dockerfile: { type: string, description: "Relative to the context (dockerfile mode only)" }
        container_port: { type: integer }
        host_port: { type: integer, description: "Unique per server; bound to 127.0.0.1 unless public" }
        public: { type: boolean }
        env: { type: object, additionalProperties: { type: string }, description: "Stored encrypted; never returned" }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            field: { type: string }
        request_id: { type: string }
    RoleRef:
      type: object
      properties:
        key: { type: string, examples: [owner] }
        name: { type: string }
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        display_name: { type: string }
        status: { type: string, enum: [active, disabled] }
        mfa_enabled: { type: boolean }
        roles: { type: array, items: { $ref: "#/components/schemas/RoleRef" } }
        last_login_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
    Me:
      type: object
      properties:
        user: { $ref: "#/components/schemas/User" }
        permissions: { type: array, items: { type: string } }
        csrf_token: { type: string }
        panel_mode: { type: string, enum: [personal, provider] }
        session:
          type: object
          properties:
            id: { type: string, format: uuid }
            expires_at: { type: string, format: date-time }
            reauthenticated_at: { type: [string, "null"], format: date-time }
    Session:
      type: object
      properties:
        id: { type: string, format: uuid }
        current: { type: boolean }
        ip: { type: string }
        user_agent: { type: string }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
    AuditEntry:
      type: object
      properties:
        id: { type: integer, format: int64 }
        actor_user_id: { type: [string, "null"], format: uuid }
        actor_label: { type: string }
        action: { type: string, examples: [auth.login] }
        target_type: { type: string }
        target_id: { type: string }
        outcome: { type: string, enum: [success, failure, denied] }
        ip: { type: string }
        user_agent: { type: string }
        request_id: { type: string }
        metadata: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }
    Role:
      type: object
      properties:
        key: { type: string }
        name: { type: string }
        description: { type: string }
        built_in: { type: boolean }
        permissions: { type: array, items: { type: string } }
    Settings:
      type: object
      properties:
        panel_mode: { type: string, enum: [personal, provider] }

security:
  - sessionCookie: []
    csrfHeader: []

paths:
  /meta:
    get:
      tags: [system]
      summary: Product and API version information
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: { type: string }
                  version: { type: string }
                  api_version: { type: string }
                  license: { type: string }
  /openapi.yaml:
    get:
      tags: [system]
      summary: This specification
      security: []
      responses:
        "200": { description: OpenAPI document }
  /auth/login:
    post:
      tags: [auth]
      summary: Sign in and receive a session cookie
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
                totp_code: { type: string, description: Required when the account has TOTP enabled }
            example: { email: admin@example.com, password: "correct horse battery staple" }
      responses:
        "200":
          description: Signed in. Sets the `osriva_session` cookie.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /auth/me:
    get:
      tags: [auth]
      summary: Current user, permissions and CSRF token
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Error" }
  /auth/logout:
    post:
      tags: [auth]
      summary: Revoke the current session
      responses:
        "204": { description: Signed out }
  /auth/reauth:
    post:
      tags: [auth]
      summary: Confirm password (and TOTP) to unlock dangerous operations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
                totp_code: { type: string }
      responses:
        "200": { description: Re-authenticated }
        "401": { $ref: "#/components/responses/Error" }
  /auth/password:
    post:
      tags: [auth]
      summary: Change own password (revokes all other sessions)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string }
                new_password: { type: string, minLength: 12 }
      responses:
        "204": { description: Changed }
        "400": { $ref: "#/components/responses/Error" }
  /auth/sessions:
    get:
      tags: [auth]
      summary: List own active sessions
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions: { type: array, items: { $ref: "#/components/schemas/Session" } }
  /auth/sessions/{id}:
    delete:
      tags: [auth]
      summary: Revoke one of your own sessions
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "204": { description: Revoked }
        "404": { $ref: "#/components/responses/Error" }
  /auth/sessions/revoke-others:
    post:
      tags: [auth]
      summary: Revoke all of your sessions except the current one
      responses:
        "200": { description: "`{revoked: n}`" }
  /auth/login-history:
    get:
      tags: [auth]
      summary: Your own authentication events
      parameters:
        - { name: limit, in: query, schema: { type: integer, maximum: 200 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  events: { type: array, items: { $ref: "#/components/schemas/AuditEntry" } }
  /auth/mfa/totp/setup:
    post:
      tags: [auth]
      summary: Start TOTP enrolment (returns the secret once)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  secret: { type: string }
                  otpauth_uri: { type: string }
        "409": { $ref: "#/components/responses/Error" }
  /auth/mfa/totp/enable:
    post:
      tags: [auth]
      summary: Confirm enrolment with a current code
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [code], properties: { code: { type: string } } }
      responses:
        "204": { description: Enabled }
        "400": { $ref: "#/components/responses/Error" }
  /auth/mfa/totp/disable:
    post:
      tags: [auth]
      summary: Disable TOTP (requires password and a current code)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, code]
              properties:
                password: { type: string }
                code: { type: string }
      responses:
        "204": { description: Disabled }
        "401": { $ref: "#/components/responses/Error" }
  /users:
    get:
      tags: [users]
      summary: List users (users.read)
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, maximum: 200 } }
        - { name: offset, in: query, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  users: { type: array, items: { $ref: "#/components/schemas/User" } }
                  total: { type: integer }
        "403": { $ref: "#/components/responses/Error" }
    post:
      tags: [users]
      summary: Create a user (users.write; can only grant permissions you hold)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, display_name, password]
              properties:
                email: { type: string }
                display_name: { type: string }
                password: { type: string, minLength: 12 }
                roles: { type: array, items: { type: string }, default: [member] }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /users/{id}:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      tags: [users]
      summary: Get a user (users.read)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      tags: [users]
      summary: Update a user (users.write; status/roles need re-auth)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name: { type: string }
                status: { type: string, enum: [active, disabled] }
                roles: { type: array, items: { type: string }, minItems: 1 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /users/{id}/sessions:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      tags: [users]
      summary: List a user's active sessions (sessions.manage_all)
      responses:
        "200": { description: "`{sessions: Session[]}`" }
  /users/{id}/sessions/revoke:
    parameters: [{ $ref: "#/components/parameters/id" }]
    post:
      tags: [users]
      summary: Sign a user out everywhere (sessions.manage_all)
      responses:
        "200": { description: "`{revoked: n}`" }
  /roles:
    get:
      tags: [users]
      summary: List roles (roles.read)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  roles: { type: array, items: { $ref: "#/components/schemas/Role" } }
  /audit-logs:
    get:
      tags: [audit]
      summary: Audit log, newest first, keyset-paginated (audit.read)
      parameters:
        - { name: action, in: query, description: Action prefix, e.g. `auth.`, schema: { type: string } }
        - { name: outcome, in: query, schema: { type: string, enum: [success, failure, denied] } }
        - { name: actor, in: query, schema: { type: string, format: uuid } }
        - { name: before, in: query, description: Return entries with id < before, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer, maximum: 200 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries: { type: array, items: { $ref: "#/components/schemas/AuditEntry" } }
                  next_before: { type: [integer, "null"] }
  /settings:
    get:
      tags: [settings]
      summary: Panel settings (settings.read)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
  /settings/panel-mode:
    put:
      tags: [settings]
      summary: Switch Personal/Provider mode (settings.write + re-auth)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode: { type: string, enum: [personal, provider] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
        "403": { $ref: "#/components/responses/Error" }
  /servers:
    get:
      tags: [servers]
      summary: List managed servers (servers.read)
      description: "`connection` is derived from the last agent report: online if one arrived in the last 3 minutes."
      responses:
        "200": { description: "`{servers: Server[]}`" }
    post:
      tags: [servers]
      summary: Add a server and get its one-time enrolment command (servers.write)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,99}$" }
      responses:
        "201": { description: "`{server, enrollment: {token, expires_at, panel_url, ca_fingerprint, command}}`. The token is shown only once." }
        "409": { $ref: "#/components/responses/Error" }
  /servers/agent-endpoint:
    get:
      tags: [servers]
      summary: Whether agent enrolment is configured, and the CA fingerprint (servers.read)
      responses:
        "200": { description: "`{configured, agent_endpoint, ca_fingerprint}`" }
  /servers/{id}:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      tags: [servers]
      summary: Server with its latest inventory and capabilities (servers.read)
      responses:
        "200": { description: "`{server, inventory | null, capabilities: Capability[], inventory_received_at}`" }
        "404": { $ref: "#/components/responses/Error" }
  /servers/{id}/enrollment-token:
    parameters: [{ $ref: "#/components/parameters/id" }]
    post:
      tags: [servers]
      summary: Replace the enrolment token of a server that has not enrolled yet (servers.write)
      responses:
        "200": { description: "`{enrollment}`" }
        "409": { $ref: "#/components/responses/Error" }
  /servers/{id}/revoke:
    parameters: [{ $ref: "#/components/parameters/id" }]
    post:
      tags: [servers]
      summary: Revoke the server's agent certificates (servers.write + re-auth)
      responses:
        "204": { description: Revoked }
        "403": { $ref: "#/components/responses/Error" }
  /agent/ca:
    get:
      tags: [agent]
      summary: Public agent CA certificate (agents verify its fingerprint before enrolling)
      security: []
      responses:
        "200": { description: "`{ca_pem, fingerprint}`" }
  /agent/enroll:
    post:
      tags: [agent]
      summary: Exchange a one-time enrolment token and CSR for a client certificate
      description: |
        Called by `osriva-agent enroll`. The token is consumed atomically. After enrolment
        the agent talks to the separate mutual-TLS listener (`OSRIVA_AGENT_PUBLIC_URL`):
        `POST /agent/v1/report` (inventory, every 60 s) and `POST /agent/v1/renew` (new
        certificate when a third of its 30-day lifetime remains). Those endpoints are not
        part of this API server and require a client certificate issued by the agent CA.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, csr_pem]
              properties:
                token: { type: string }
                csr_pem: { type: string, description: "PKCS#10 CSR, ECDSA P-256/P-384, Ed25519 or RSA >= 3072" }
                agent_version: { type: string }
      responses:
        "200": { description: "`{server_id, server_name, certificate_pem, ca_pem, agent_endpoint}`" }
        "401": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /agent/downloads:
    get:
      tags: [agent]
      summary: Agent builds served by this panel, with SHA-256 checksums
      security: []
      responses:
        "200": { description: "`{builds: [{os, arch, size, sha256, url}]}`" }
  /agent/download/{os}/{arch}:
    get:
      tags: [agent]
      summary: Download an agent binary
      security: []
      parameters:
        - { name: os, in: path, required: true, schema: { type: string, enum: [linux, windows, freebsd, openbsd, netbsd] } }
        - { name: arch, in: path, required: true, schema: { type: string, enum: [amd64, arm64, arm] } }
      responses:
        "200": { description: Binary (`X-Checksum-SHA256` header) }
        "404": { $ref: "#/components/responses/Error" }
  /agent/download/{os}/{arch}/sha256:
    get:
      tags: [agent]
      summary: SHA-256 of an agent binary (plain text)
      security: []
      parameters:
        - { name: os, in: path, required: true, schema: { type: string } }
        - { name: arch, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Hex digest }
  /agent/install.sh:
    get:
      tags: [agent]
      summary: One-line installer for Linux/BSD (download, verify, enrol, install the service)
      security: []
      responses:
        "200": { description: POSIX shell script }
  /agent/install.ps1:
    get:
      tags: [agent]
      summary: One-line installer for Windows (download, verify, enrol, install the Windows service)
      security: []
      responses:
        "200": { description: PowerShell script }
  /servers/{id}/tasks:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      tags: [servers]
      summary: Recent tasks of a server, newest first (servers.read)
      parameters:
        - { name: limit, in: query, schema: { type: integer, maximum: 100 } }
      responses:
        "200": { description: "`{tasks: Task[]}` (results omitted; fetch a task for its result)" }
    post:
      tags: [servers]
      summary: Queue a typed task for the agent
      description: |
        Allowed types (closed list, validated again by the agent):
        `services.list` and `processes.list` (servers.read, params `{}`), and
        `service.action` (servers.operate, params `{name, action}` with action
        start|stop|restart|enable|disable; stop/disable need re-auth).
        `logs.read` (servers.read, params `{source: system|application|service, service?, lines?, min_level?}`).
        `files.list|files.read|files.write|files.mkdir|files.delete` (servers.files; writes need
        re-auth; params `{path}` or `{path, content, create?}`), confined by the agent's own policy.
        `users.list`, `cron.list`, `system.time`, `sshkeys.list` (servers.read);
        `sshkeys.add` / `sshkeys.remove` (servers.access + re-auth, params `{user, key}` / `{user, fingerprint}`);
        `system.hostname` / `system.timezone` (servers.operate + re-auth).
        `docker.info|docker.containers|docker.container.logs|docker.images|docker.volumes|docker.networks` (servers.read);
        `docker.container.action|docker.container.run|docker.image.pull|docker.image.remove|docker.images.prune`
        (servers.operate; run/stop/remove/prune need re-auth). Deployments (`app.deploy`, `app.remove`) are
        queued through the apps endpoints. Queued tasks expire after 2 minutes if the agent does not pick them up.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type: { type: string, enum: [services.list, service.action, processes.list, logs.read, files.list, files.read, files.write, files.mkdir, files.delete, users.list, sshkeys.list, sshkeys.add, sshkeys.remove, cron.list, system.time, system.hostname, system.timezone, docker.info, docker.containers, docker.container.action, docker.container.logs, docker.container.run, docker.images, docker.image.pull, docker.image.remove, docker.images.prune, docker.volumes, docker.networks] }
                params: { type: object }
            example: { type: service.action, params: { name: nginx.service, action: restart } }
      responses:
        "202": { description: "Task (status `queued`)" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /servers/{id}/tasks/{taskId}:
    parameters:
      - { $ref: "#/components/parameters/id" }
      - { name: taskId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [servers]
      summary: A task with its result; `wait` (0-25 s) holds the request until it finishes
      parameters:
        - { name: wait, in: query, schema: { type: integer, maximum: 25 } }
      responses:
        "200": { description: "Task: {id, type, params, status, result, error, created_at, started_at, finished_at}" }
  /servers/{id}/apps:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      tags: [apps]
      summary: Apps on a server with their live deployment (servers.read)
      responses:
        "200": { description: "`{apps: App[]}`; environment variable names only, never values" }
    post:
      tags: [apps]
      summary: Create an app (servers.operate)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppInput" }
      responses:
        "201": { description: App }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /servers/{id}/apps/{appId}:
    parameters:
      - { $ref: "#/components/parameters/id" }
      - { name: appId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [apps]
      summary: An app with its last 30 deployments (servers.read)
      responses:
        "200": { description: App }
    put:
      tags: [apps]
      summary: Replace the app settings (servers.operate); omit `env` to keep the stored variables
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppInput" }
      responses:
        "200": { description: App }
    delete:
      tags: [apps]
      summary: Remove the app container and builds from the server and the app from the panel (servers.operate + re-auth)
      responses:
        "202": { description: "The queued `app.remove` task" }
  /servers/{id}/apps/{appId}/deployments:
    parameters:
      - { $ref: "#/components/parameters/id" }
      - { name: appId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [apps]
      summary: Deploy the configured branch or tag (servers.operate + re-auth)
      responses:
        "202": { description: "Deployment (status `queued`); poll it for the result" }
  /servers/{id}/apps/{appId}/deployments/{depId}:
    parameters:
      - { $ref: "#/components/parameters/id" }
      - { name: appId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: depId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [apps]
      summary: A deployment with its build and run log (servers.read)
      responses:
        "200": { description: "Deployment: {id, kind, image, git_ref, status, error, result: {commit, image, state, recovered, logs, duration_ms}}" }
  /servers/{id}/apps/{appId}/deployments/{depId}/rollback:
    parameters:
      - { $ref: "#/components/parameters/id" }
      - { name: appId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: depId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [apps]
      summary: Run an earlier successful build again with the current settings (servers.operate + re-auth)
      responses:
        "202": { description: "Deployment of kind `rollback`" }
        "409": { $ref: "#/components/responses/Error" }
  /servers/{id}/websites:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      tags: [websites]
      summary: Proxy settings and websites of a server with a DNS hint per domain (servers.read)
      responses:
        "200": { description: "`{proxy: {enabled, http_port, https_port, acme_email, acme_staging}, server_ip, sites: [{id, domain, upstream_port, tls_mode, dns: {addresses, points_here, error?}}]}`" }
  /servers/{id}/proxy:
    parameters: [{ $ref: "#/components/parameters/id" }]
    put:
      tags: [websites]
      summary: Save the reverse proxy settings and apply them (servers.operate + re-auth); disabling removes the proxy container
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled: { type: boolean }
                http_port: { type: integer }
                https_port: { type: integer }
                acme_email: { type: string }
                acme_staging: { type: boolean }
      responses:
        "200": { description: "`{proxy, task}`: the queued proxy.apply or proxy.disable task (or null)" }
  /servers/{id}/sites:
    parameters: [{ $ref: "#/components/parameters/id" }]
    post:
      tags: [websites]
      summary: Add a website (servers.operate + re-auth); applied at once when the proxy is on
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain, upstream_port, tls_mode]
              properties:
                domain: { type: string, description: "Lower-case DNS name; unique across servers; no wildcards or IPs" }
                upstream_port: { type: integer, description: "Local port on the server (127.0.0.1)" }
                tls_mode: { type: string, enum: [acme, internal, none] }
      responses:
        "201": { description: "`{site, task}`" }
  /servers/{id}/sites/{siteId}:
    parameters:
      - { $ref: "#/components/parameters/id" }
      - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [websites]
      summary: Change a website (servers.operate + re-auth)
      responses:
        "200": { description: "`{site, task}`" }
    delete:
      tags: [websites]
      summary: Stop serving a website (servers.operate + re-auth)
      responses:
        "200": { description: "`{task}`" }
  /servers/{id}/metrics:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      tags: [servers]
      summary: Live metric samples (servers.read); values a platform cannot provide are omitted
      parameters:
        - { name: minutes, in: query, schema: { type: integer, maximum: 1440, default: 60 } }
      responses:
        "200": { description: "`{samples: [{ts, cpu_percent?, mem_used_bytes?, mem_total_bytes?, load1?, net_rx_bps?, net_tx_bps?, disks?}]}`" }
