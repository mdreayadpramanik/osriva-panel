name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: osriva_test
          POSTGRES_USER: osriva
          POSTGRES_PASSWORD: osriva
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U osriva -d osriva_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # Disposable CI database: the PostgreSQL tests drop and recreate its schema.
      OSRIVA_TEST_DATABASE_URL: postgres://osriva:osriva@localhost:5432/osriva_test?sslmode=disable
      OSRIVA_TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - name: Test (with race detector and PostgreSQL integration tests)
        run: go test -race -count=1 ./...
      - run: go build -o /dev/null ./services/api/cmd/osriva-api
      - name: Known vulnerabilities (govulncheck)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
      - name: Fuzz the security parsers (30 s each)
        run: |
          set -e
          for t in FuzzValidate FuzzValidRelPath FuzzValidGitRef FuzzValidGitURL FuzzURLValidators FuzzHostnames; do
            go test ./pkg/agenttask -run '^$' -fuzz "^$t\$" -fuzztime 30s
          done
          go test ./pkg/pluginsdk -run '^$' -fuzz '^FuzzManifestSignature$' -fuzztime 30s
          go test ./agent/internal/tasks -run '^$' -fuzz '^FuzzGuardCheck$' -fuzztime 30s
          go test ./agent/internal/tasks -run '^$' -fuzz '^FuzzExtract$' -fuzztime 30s
      - name: Performance on PostgreSQL 17 (300 servers)
        run: OSRIVA_PERF=1 OSRIVA_PERF_OUT="$PWD/perf.json" go test -count=1 -run TestPerformance -v ./services/api/internal/store/postgres/
      - uses: actions/upload-artifact@v4
        with:
          name: performance
          path: perf.json
      - name: Plugin SDK end to end (keygen, sign, verify, tamper)
        run: |
          d="$(mktemp -d)"; mkdir -p "$d/chat-notifier"
          go build -o "$d/osriva-plugin" ./pkg/pluginsdk/cmd/osriva-plugin
          go build -o "$d/chat-notifier/chat-notifier" ./pkg/pluginsdk/examples/chat-notifier
          printf '{"name":"chat-notifier","version":"0.1.0","publisher":"ci","description":"","protocol":1,"kinds":["notifier"],"executables":{"linux/amd64":{"path":"chat-notifier","sha256":"%064d"}}}' 0 > "$d/chat-notifier/plugin.json"
          pub="$("$d/osriva-plugin" keygen --out "$d/publisher.key" | awk '/public key/ {print $3}')"
          test "$(stat -c %a "$d/publisher.key")" = 600
          "$d/osriva-plugin" sign --key "$d/publisher.key" "$d/chat-notifier"
          "$d/osriva-plugin" verify --trusted "$pub" "$d/chat-notifier"
          echo '{"protocol":1,"method":"describe"}' | env -i "$d/chat-notifier/chat-notifier" | grep -q '"name":"chat-notifier"'
          echo tampered >> "$d/chat-notifier/chat-notifier"
          if "$d/osriva-plugin" verify --trusted "$pub" "$d/chat-notifier"; then echo "a tampered binary verified"; exit 1; fi
      - name: Agent inventory on a real Linux host (Ubuntu runner)
        run: |
          go run ./agent/cmd/osriva-agent inventory --capabilities | tee inventory.json
          jq -e '.inventory.os.family == "linux" and (.inventory.memory.total_bytes > 0) and (.inventory.disks | length > 0) and (.inventory.os.name | length > 0)' inventory.json
      - name: Cross-compile the agent
        run: |
          for t in linux/amd64 linux/arm64 linux/arm windows/amd64 windows/arm64 freebsd/amd64 freebsd/arm64 openbsd/amd64 netbsd/amd64; do
            echo "building $t"
            GOOS=${t%/*} GOARCH=${t#*/} CGO_ENABLED=0 go build -o /dev/null ./agent/cmd/osriva-agent
          done

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:dashboard

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -f infrastructure/docker/api.Dockerfile .
      - run: docker build -f infrastructure/docker/dashboard.Dockerfile .

  # Compatibility evidence beyond the main Ubuntu runner (docs/COMPATIBILITY_MATRIX.md).
  arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Agent and shared packages on linux/arm64
        run: go test -count=1 ./agent/... ./pkg/...
      - name: Agent inventory on a real arm64 host
        run: |
          go run ./agent/cmd/osriva-agent inventory --capabilities | tee inventory.json
          jq -e '.inventory.os.family == "linux" and .inventory.os.arch == "arm64" and (.inventory.memory.total_bytes > 0) and (.inventory.cpu.logical_cores > 0)' inventory.json

  distros:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: CGO_ENABLED=0 go build -o osriva-agent ./agent/cmd/osriva-agent
      - name: Inventory and OS detection inside distribution containers
        run: |
          set -e
          for spec in debian:12=debian rockylinux:9=rocky almalinux:9=almalinux alpine:3.20=alpine opensuse/leap:15.6=opensuse-leap fedora:41=fedora; do
            image="${spec%=*}"; want="${spec#*=}"
            out="$(docker run --rm -v "$PWD/osriva-agent:/osriva-agent:ro" "$image" /osriva-agent inventory --capabilities)"
            id="$(jq -r .inventory.os.id <<<"$out")"; name="$(jq -r .inventory.os.name <<<"$out")"
            echo "$image -> id=$id name=$name"
            [ "$id" = "$want" ] || { echo "expected $want"; exit 1; }
            jq -e '.inventory.os.family == "linux" and (.inventory.memory.total_bytes > 0) and (.capabilities | length > 0)' <<<"$out" >/dev/null
          done
